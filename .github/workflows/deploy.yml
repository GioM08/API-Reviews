name: Deploy to Raspberry Pi

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: [self-hosted, rpi5]
    timeout-minutes: 15

    steps:
      - name: Pull latest code
        run: |
          cd /home/gio/API-Reviews
          git pull origin main

      - name: Build and restart services
        run: |
          cd /home/gio/API-Reviews
          docker compose up -d --build

      - name: Prune old images
        run: docker image prune -f

      - name: Healthcheck — all containers running
        working-directory: /home/gio/API-Reviews
        run: |
          echo "Waiting up to 60s for containers to stabilise..."
          for i in $(seq 1 12); do
            NOT_RUNNING=$(docker compose ps --format json \
              | python3 -c "
          import sys, json
          lines = [l for l in sys.stdin if l.strip()]
          bad = [json.loads(l)['Service'] for l in lines if json.loads(l).get('State') != 'running']
          print(' '.join(bad))
          ")
            if [ -z "$NOT_RUNNING" ]; then
              echo "All containers running after $((i * 5))s"
              break
            fi
            if [ "$i" -eq 12 ]; then
              echo "FAILED — containers not running after 60s: $NOT_RUNNING"
              docker compose ps
              exit 1
            fi
            echo "Attempt $i/12 — not ready yet: $NOT_RUNNING — retrying in 5s..."
            sleep 5
          done

      - name: Healthcheck — auth-service (/api/auth/health)
        working-directory: /home/gio/API-Reviews
        run: |
          for i in $(seq 1 6); do
            if docker compose exec -T auth-service \
                curl -sf --max-time 5 http://localhost:3000/api/auth/health; then
              echo "auth-service OK"
              break
            fi
            if [ "$i" -eq 6 ]; then echo "auth-service FAILED after 30s"; exit 1; fi
            echo "Attempt $i/6 — retrying in 5s..."
            sleep 5
          done

      - name: Healthcheck — restaurant-service (/api/restaurants/health)
        working-directory: /home/gio/API-Reviews
        run: |
          for i in $(seq 1 6); do
            if docker compose exec -T restaurant-service \
                curl -sf --max-time 5 http://localhost:3003/api/restaurants/health; then
              echo "restaurant-service OK"
              break
            fi
            if [ "$i" -eq 6 ]; then echo "restaurant-service FAILED after 30s"; exit 1; fi
            echo "Attempt $i/6 — retrying in 5s..."
            sleep 5
          done

      - name: Healthcheck — review-service (/api/reviews/health)
        working-directory: /home/gio/API-Reviews
        run: |
          for i in $(seq 1 6); do
            if docker compose exec -T review-service \
                curl -sf --max-time 5 http://localhost:3004/api/reviews/health; then
              echo "review-service OK"
              break
            fi
            if [ "$i" -eq 6 ]; then echo "review-service FAILED after 30s"; exit 1; fi
            echo "Attempt $i/6 — retrying in 5s..."
            sleep 5
          done
