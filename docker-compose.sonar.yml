# -------------------------------------------------------------------
# SonarQube (Community Edition) - analisis de codigo estatico local
# -------------------------------------------------------------------
# Levantar:
#   docker compose -f docker-compose.sonar.yml up -d
#
# UI disponible en: http://localhost:9002 (usuario/clave inicial: admin/admin)
#
# Detener:
#   docker compose -f docker-compose.sonar.yml down
# Detener y borrar datos:
#   docker compose -f docker-compose.sonar.yml down -v
#
# Requisito (Docker Desktop / WSL2): aumentar vm.max_map_count
#   wsl -d docker-desktop -u root sysctl -w vm.max_map_count=524288
# -------------------------------------------------------------------

name: api-reviews-sonar

services:
  sonarqube-db:
    image: postgres:16
    container_name: sonarqube-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - sonarqube_db_data:/var/lib/postgresql/data
    networks:
      - sonar-network

  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    restart: unless-stopped
    depends_on:
      - sonarqube-db
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    ports:
      - "9002:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - sonar-network

networks:
  sonar-network:
    name: api-reviews-sonar-network
    driver: bridge

volumes:
  sonarqube_db_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
