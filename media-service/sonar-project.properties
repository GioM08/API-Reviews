sonar.projectKey=foodranker-media-service
sonar.projectName=FoodRanker - Media Service
sonar.projectVersion=1.0

sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.js

sonar.exclusions=**/node_modules/**,**/coverage/**
sonar.coverage.exclusions=src/server.js

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8

# El scanner corre montando solo esta carpeta (sin .git del monorepo)
sonar.scm.disabled=true
