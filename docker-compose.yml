services:
  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    networks:
      - micro-network

  postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - micro-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - micro-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - micro-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build: ./auth-service
    ports:
      - "3000:3000"
    env_file:
      - ./auth-service/.env
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_started
    networks:
      - micro-network

  user-service:
    build: ./user-service
    ports:
      - "3001:3001"
    env_file:
      - ./user-service/.env
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_started
    networks:
      - micro-network

  restaurant-service:
    build: ./restaurant-service
    ports:
      - "3003:3003"
    env_file:
      - ./restaurant-service/.env
    volumes:
      - ./auth-service/keys/public.key:/app/keys/public.key:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - micro-network

  review-service:
    build: ./review-service
    ports:
      - "3004:3004"
    env_file:
      - ./review-service/.env
    volumes:
      - ./auth-service/keys/public.key:/app/keys/public.key:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - micro-network

  media-service:
    build: ./media-service
    ports:
      - "50051:50051"
      - "3005:3005"
    env_file:
      - ./media-service/.env
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - micro-network

  social-service:
    build: ./social-service
    ports:
      - "3006:3006"
    env_file:
      - ./social-service/.env
    volumes:
      - ./auth-service/keys/public.key:/app/keys/public.key:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_started
    networks:
      - micro-network

  notification-service:
    build: ./notification-service
    ports:
      - "3007:3007"
    env_file:
      - ./notification-service/.env
    volumes:
      - ./auth-service/keys/public.key:/app/keys/public.key:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_started
    networks:
      - micro-network

networks:
  micro-network:
    driver: bridge
